<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Portafolio{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">Portafolio</a>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">
                    <span class="toggle-icon">🌙</span>
                </button>
                <button class="nav-toggle" id="navToggle" aria-label="Menú de navegación">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </button>
            </div>
            <ul class="nav-links" id="navLinks">
                <li><a href="/#inicio" class="nav-link-anchor">Inicio</a></li>
                <li><a href="/#proyectos" class="nav-link-anchor">Proyectos</a></li>
                <li><a href="/#habilidades" class="nav-link-anchor">Habilidades</a></li>
                <li><a href="/#contacto" class="nav-link-anchor">Contacto</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 - Todos los derechos reservados</p>
        <div class="footer-links">
            <a href="https://github.com/" target="_blank">GitHub</a>
            <a href="https://linkedin.com/" target="_blank">LinkedIn</a>
        </div>
    </footer>

    <script src="/static/js/main.js"></script>
</body>
</html>
