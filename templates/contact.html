{% extends "base.html" %}

{% block title %}Contacto - Mi Portafolio{% endblock %}

{% block content %}
<section class="page-section">
    <h1 class="section-title">Contacto</h1>
    <p class="section-subtitle">¿Tienes un proyecto en mente? Hablemos</p>

    <div class="contact-container">
        <form class="contact-form" id="contactForm">
            <div class="form-group">
                <label for="name">Nombre</label>
                <input type="text" id="name" name="name" required placeholder="Tu nombre">
            </div>
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required placeholder="tu@correo.com">
            </div>
            <div class="form-group">
                <label for="subject">Asunto</label>
                <input type="text" id="subject" name="subject" required placeholder="Asunto del mensaje">
            </div>
            <div class="form-group">
                <label for="message">Mensaje</label>
                <textarea id="message" name="message" rows="5" required placeholder="Escribe tu mensaje aquí..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Enviar Mensaje</button>
        </form>

        <div class="contact-info">
            <h3>También puedes encontrarme en:</h3>
            <div class="contact-item">
                <span class="contact-icon">📧</span>
                <span>{{ contact.email }}</span>
            </div>
            <div class="contact-item">
                <span class="contact-icon">🐙</span>
                <a href="https://github.com/{{ contact.github }}" target="_blank">github.com/{{ contact.github }}</a>
            </div>

        </div>
    </div>
</section>
{% endblock %}
