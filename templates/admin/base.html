<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %} - Mi Portafolio</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .admin-layout { display: flex; min-height: 100vh; }
        .admin-sidebar { width: 260px; background: var(--nav-bg); border-right: 1px solid var(--border); padding: 2rem 1rem; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; }
        .admin-sidebar h2 { color: var(--accent); margin-bottom: 2rem; font-size: 1.3rem; }
        .admin-nav { list-style: none; display: flex; flex-direction: column; gap: 0.3rem; }
        .admin-nav a { display: flex; align-items: center; gap: 0.8rem; padding: 0.8rem 1rem; border-radius: 10px; text-decoration: none; color: var(--text-primary); transition: all 0.2s; font-weight: 500; }
        .admin-nav a:hover { background: var(--bg-secondary); color: var(--accent); }
        .admin-logout { margin-top: auto; padding-top: 2rem; border-top: 1px solid var(--border); }
        .admin-logout a { color: #e74c3c; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; font-weight: 500; }
        .admin-logout a:hover { text-decoration: underline; }
        .admin-main { flex: 1; margin-left: 260px; padding: 2rem 3rem; background: var(--bg-primary); min-height: 100vh; }
        .admin-main h1 { margin-bottom: 2rem; color: var(--text-primary); }
        .dashboard-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; }
        .dash-card { background: var(--bg-card); border-radius: 16px; padding: 2rem; text-align: center; box-shadow: var(--card-shadow); border: 1px solid var(--border); transition: all 0.3s; text-decoration: none; display: block; }
        .dash-card:hover { transform: translateY(-3px); box-shadow: var(--card-hover-shadow); }
        .dash-card .icon { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; }
        .dash-card .label { color: var(--text-primary); font-weight: 600; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.8rem; border-bottom: 1px solid var(--border); }
        th { font-weight: 600; color: var(--text-secondary); font-size: 0.9rem; }
        td { color: var(--text-primary); }
        .admin-form { max-width: 600px; }
        .admin-form .form-group { margin-bottom: 1.5rem; }
        .admin-form label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-primary); }
        .admin-form input, .admin-form textarea, .admin-form select { width: 100%; padding: 0.8rem; border: 2px solid var(--border); border-radius: 8px; background: var(--bg-primary); color: var(--text-primary); font-size: 1rem; font-family: inherit; }
        .admin-form input:focus, .admin-form textarea:focus { outline: none; border-color: var(--accent); }
        .admin-form textarea { resize: vertical; }
        .actions { display: flex; gap: 0.5rem; }
        .actions form { display: inline; }
        .btn-small { padding: 0.4rem 1rem; font-size: 0.85rem; border-radius: 6px; cursor: pointer; border: none; font-weight: 500; }
        .btn-edit { background: var(--accent); color: white; }
        .btn-delete { background: #e74c3c; color: white; }
        .btn-cancel { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); }
        .back-link { display: inline-block; margin-bottom: 1.5rem; color: var(--accent); text-decoration: none; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
        .empty-state { text-align: center; padding: 3rem; color: var(--text-secondary); }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 2000; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--bg-card); border-radius: 16px; padding: 2rem; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; border: 1px solid var(--border); }
        .modal h2 { margin-bottom: 1.5rem; color: var(--text-primary); }
        .modal-actions { display: flex; gap: 1rem; margin-top: 1.5rem; justify-content: flex-end; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .section-header h1 { margin-bottom: 0; }
        @media (max-width: 768px) {
            .admin-sidebar { width: 200px; }
            .admin-main { margin-left: 200px; padding: 1.5rem; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <h2>⚙️ Admin</h2>
            <ul class="admin-nav">
                <li><a href="/admin/dashboard">📊 Dashboard</a></li>
                <li><a href="/admin/hero">👤 Hero / Inicio</a></li>
                <li><a href="/admin/projects">📁 Proyectos</a></li>
                <li><a href="/admin/skills">🎯 Habilidades</a></li>
                <li><a href="/admin/contact">📬 Contacto</a></li>
            </ul>
            <div class="admin-logout">
                <a href="/admin/logout">🚪 Cerrar sesión</a>
                <a href="/" style="margin-top:0.5rem; color:var(--accent); text-decoration:none; display:block; font-weight:500;">← Ver portafolio</a>
            </div>
        </aside>
        <main class="admin-main">
            {% block content %}{% endblock %}
        </main>
    </div>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
