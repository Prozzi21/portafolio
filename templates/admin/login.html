<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Mi Portafolio</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-secondary); }
        .login-card { background: var(--bg-card); padding: 3rem; border-radius: 16px; box-shadow: var(--card-shadow); width: 100%; max-width: 400px; border: 1px solid var(--border); }
        .login-card h1 { text-align: center; margin-bottom: 2rem; color: var(--text-primary); }
        .login-error { background: #ffebee; color: #c62828; padding: 0.8rem; border-radius: 8px; margin-bottom: 1rem; text-align: center; }
        .login-link { text-align: center; margin-top: 1rem; }
        .login-link a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body class="login-page">
    <div class="login-card">
        <h1>🔐 Admin</h1>
        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/admin/login">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required placeholder="admin">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
        </form>
        <div class="login-link">
            <a href="/">← Volver al portafolio</a>
        </div>
    </div>
</body>
</html>
